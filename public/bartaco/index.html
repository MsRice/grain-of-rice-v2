<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2A4A7C" />
  <title>bartaco Recipe Book</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="img/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <use href="#dragonfly" />
      </svg>
      <h1 class="brand-title">bartaco</h1>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="gear">
        <path d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.4-3.5a7.6 7.6 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7.4 7.4 0 0 0-1.7-1l-.3-2.5h-4l-.3 2.5a7.4 7.4 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7.4 7.4 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.4 7.4 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5c.1-.3.1-.7.1-1Z" />
      </svg>
    </button>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/>
      </svg>
      <input id="search" type="search" inputmode="search" placeholder="Search drinks or ingredients" aria-label="Search drinks" autocomplete="off" />
    </div>
    <div id="filters" class="filters" role="tablist" aria-label="Filter by category"></div>
  </div>

  <main class="layout">
    <ul id="list" class="recipe-list" aria-label="Recipes"></ul>

    <section id="detail" class="detail" aria-live="polite">
      <div id="placeholder" class="placeholder">
        <svg class="placeholder-mark" viewBox="0 0 64 64" aria-hidden="true">
          <use href="#dragonfly" />
        </svg>
        <p class="placeholder-text">Pick a drink</p>
      </div>
      <article id="detailContent" class="detail-content" hidden></article>
    </section>
  </main>

  <!-- Settings dialog -->
  <div id="settings" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet-head">
        <h2 id="settingsTitle">Settings</h2>
        <button id="settingsClose" class="icon-btn" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6 6.4 5Z"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <label class="row-toggle">
          <span>
            <strong>Dark theme</strong>
            <small>Easier on the eyes in a dim bar</small>
          </span>
          <span class="switch">
            <input id="themeToggle" type="checkbox" role="switch" />
            <span class="track" aria-hidden="true"></span>
          </span>
        </label>
      </div>
    </div>
  </div>

  <!-- Shared SVG symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="dragonfly" viewBox="0 0 64 64">
      <path d="M32 6c-1.1 0-2 1.1-2 2.4 0 .8.3 1.5.8 1.9-.5.4-.8 1.1-.8 1.9 0 1.1.6 2 1.4 2.3l-1 4.6c-6-3.4-13.7-5.1-20.6-4.3-1.4.2-2.4 1-2.4 1.9 0 1 1.2 1.9 3 2.4 5.6 1.6 12.6 1.9 18.6 1l-.5 2.2c-5.3-.4-11.2.6-15.7 2.9-1.2.6-1.9 1.4-1.7 2.2.2.9 1.4 1.4 3 1.3 4.6-.3 9.6-1.8 13.6-4l-.3 1.3c3 11 3.2 23.3 1.4 34.2-.2 1.1.5 2.1 1.4 2.1h1.2c.9 0 1.6-1 1.4-2.1-1.8-10.9-1.6-23.2 1.4-34.2l-.3-1.3c4 2.2 9 3.7 13.6 4 1.6.1 2.8-.4 3-1.3.2-.8-.5-1.6-1.7-2.2-4.5-2.3-10.4-3.3-15.7-2.9l-.5-2.2c6 .9 13 .6 18.6-1 1.8-.5 3-1.4 3-2.4 0-.9-1-1.7-2.4-1.9-6.9-.8-14.6.9-20.6 4.3l-1-4.6c.8-.3 1.4-1.2 1.4-2.3 0-.8-.3-1.5-.8-1.9.5-.4.8-1.1.8-1.9C34 7.1 33.1 6 32 6Z"/>
    </symbol>
  </svg>

  <script src="app.js"></script>
</body>
</html>
